services:
  bot:
    build: .
    image: ip_cheker_2
    container_name: ip_cheker_2
    restart: unless-stopped
    init: true                      # PID 1 корректно жнёт ping-подпроцессы и передаёт SIGTERM
    env_file: .env                  # секреты передаются переменными окружения, в образ не копируются
    environment:
      DATA_DIR: /app/data
      ENV_FILE: /app/data/.env
      TZ: ${TZ:-UTC}                # например Europe/Moscow — влияет на время в истории и логах
    volumes:
      - bot_data:/app/data
      # Хочешь видеть JSON прямо в папке проекта? Тогда:
      #   mkdir -p data && sudo chown 1000:1000 data
      #   закомментируй строку выше и раскомментируй следующую:
      # - ./data:/app/data
    sysctls:
      # ICMP без root: разрешаем непривилегированные ICMP-сокеты всем группам.
      # Работает даже там, где file-capabilities запрещены (no-new-privileges).
      net.ipv4.ping_group_range: "0 2147483647"
    extra_hosts:
      # Чтобы прокси, запущенный НА ХОСТЕ, был доступен как host.docker.internal
      # (на Docker Desktop работает из коробки, на Linux нужен host-gateway).
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    # Linux-вариант, если прокси слушает только 127.0.0.1 хоста
    # или нужно сканировать сеть хоста «как с самой машины»:
    # network_mode: host
    # (тогда extra_hosts не нужен, а в PROXY_URL можно оставить 127.0.0.1)

volumes:
  bot_data:
